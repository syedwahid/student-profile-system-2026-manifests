apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-sql
  namespace: student-profile-system-2026-gha
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS students (
        id SERIAL PRIMARY KEY,
        name VARCHAR(255) NOT NULL,
        age INTEGER NOT NULL,
        grade VARCHAR(1) NOT NULL,
        email VARCHAR(255) NOT NULL,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );
    INSERT INTO students (name, age, grade, email) VALUES
        ('John Doe', 20, 'A', 'john@school.com'),
        ('Jane Smith', 21, 'B', 'jane@school.com'),
        ('Mike Johnson', 19, 'A', 'mike@school.com'),
        ('Sarah Wilson', 22, 'C', 'sarah@school.com');
    CREATE INDEX idx_students_grade ON students(grade);
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: student-profile-system-2026-gha
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: student-profile-system-2026-gha
spec:
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  strategy: { type: Recreate }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        env:
        - name: POSTGRES_USER
          valueFrom: { secretKeyRef: { name: student-db-secret, key: DB_USER } }
        - name: POSTGRES_PASSWORD
          valueFrom: { secretKeyRef: { name: student-db-secret, key: DB_PASSWORD } }
        - name: POSTGRES_DB
          valueFrom: { secretKeyRef: { name: student-db-secret, key: DB_NAME } }
        ports: [{ containerPort: 5432 }]
        volumeMounts:
        - { name: postgres-storage, mountPath: /var/lib/postgresql/data }
        - { name: init-sql, mountPath: /docker-entrypoint-initdb.d/init.sql, subPath: init.sql }
        readinessProbe:
          exec: { command: ["pg_isready", "-U", "student_admin"] }
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: postgres-storage
        persistentVolumeClaim: { claimName: postgres-pvc }
      - name: init-sql
        configMap: { name: postgres-init-sql }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: student-profile-system-2026-gha
spec:
  selector: { app: postgres }
  ports: [{ port: 5432 }]
  clusterIP: None
